<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Flow If-Else, Switch</title>
  </head>
  <body>
    <!--lab Assignment Task 1-->
    <script>
      let no = -8;
      if (no > 0) {
        document.write("<br>No is Positive");
      } else if (no < 0) {
        document.write("<br> No is Negative");
      } else {
        document.write("<br> No is Zero");
      }
    </script>
  </body>
</html>
