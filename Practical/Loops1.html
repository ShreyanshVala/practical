<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task1</title>
  </head>
  <body>
    <script>
      //For Loop
      for (let i = 1; i <= 10; i++) {
        document.write("<br>", i);
      }

      document.write("<hr>");

      //while loop
      let i = 1;
      let sum = 0;
      while (i <= 10) {
        if (i % 2 === 0) {
          sum = sum + i;
        }
        i++;
      }
      document.write("<br>Sum of even Numbers", sum);

      document.write("<hr>");

      //Task 2

      let ii = 1;
      let summ = 0;

      document.write("Even numbers between 1 and 20:<br>");

      while (ii <= 20) {
        if (ii % 2 === 0) {
          document.write(ii + "<br>");
          summ += ii;
        }
        ii++;
      }

      document.write("<br>Total Sum = " + summ);
    </script>
  </body>
</html>
