<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>javaScript Operator</title>
  </head>
  <body>
    <script>
      let a = 10;
      let b = 5;

      // 🔢 Arithmetic Operators
      document.write("<br>Addition:", a + b);
      document.write("<br>Subtraction:", a - b);
      document.write("<br>Multiplication:", a * b);
      document.write("<br>Division:", a / b);

      // ⚖️ Comparison Operators
      document.write("<br>Are a and b equal   :", a == b);
      document.write("<br> Is a is greater than b :", a > b);

      // 🔗 Logical Operators
      let x = 15;
      let y = 3;

      if (x > 10 && y < 5) {
        document.write("Both conditions are TRUE");
      } else {
        document.write("One or both conditions are FALSE");
      }
    </script>
  </body>
</html>
