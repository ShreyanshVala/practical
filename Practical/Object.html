<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Car Object Example</title>
  </head>
  <body>
    <script>
      // Create car object
      let car = {
        brand: "Toyota",
        model: "Fortuner",
        year: 2022,
      };

      // Access and print brand and model
      document.write("Brand: " + car.brand + "<br>");
      document.write("Model: " + car.model + "<br>");

      // Update year property
      car.year = 2025;

      // Add new property color
      car.color = "Black";

      // Print updated object values
      document.write("Updated Year: " + car.year + "<br>");
      document.write("Color: " + car.color);
    </script>
  </body>
</html>
