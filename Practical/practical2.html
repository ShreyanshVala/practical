<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Data Types Example</title>
  </head>
  <body>
    <script>
      // Declare variables
      let str = "Hello World"; // string
      let num = 25; // number
      let isTrue = true; // boolean
      let emptyValue = null; // null
      let notDefined; // undefined

      // Log values and types
      console.log("String:", str, "Type:", typeof str);
      console.log("Number:", num, "Type:", typeof num);
      console.log("Boolean:", isTrue, "Type:", typeof isTrue);
      console.log("Null:", emptyValue, "Type:", typeof emptyValue);
      console.log("Undefined:", notDefined, "Type:", typeof notDefined);
    </script>
  </body>
</html>
