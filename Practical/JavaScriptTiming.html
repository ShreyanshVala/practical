    <!doctype html>
    <html>
      <head>
        <title>Digital Clock</title>
        <style>
          #clock {
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            margin-top: 100px;
          }
        </style>
      </head>
      <body>
        <div id="clock"></div>

        <script>
          function updateClock() {
            let now = new Date();
            let time = now.toLocaleTimeString();
            document.getElementById("clock").innerHTML = time;
          }

          // Clock immediately show કરો
          updateClock();

          // Every second update કરો
          setInterval(updateClock, 1000);
        </script>
      </body>
    </html>
  </body>
